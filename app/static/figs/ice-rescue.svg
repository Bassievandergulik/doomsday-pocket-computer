" stroke-width="3" paint-order="stroke" stroke-linejoin="round">back the way you came</text><text x="80" y="66" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(that ice held you)</text><text x="300" y="50" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">arms on the ice, kick legs</text><text x="300" y="66" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">up level, slide out on belly,</text><text x="300" y="82" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">then ROLL away, don't stand</text><path d="M260 150 q10 -10 20 0 M290 160 q10 -10 20 0" stroke="#3b78b0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
