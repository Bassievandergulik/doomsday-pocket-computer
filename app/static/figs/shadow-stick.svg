<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" font-family="DejaVu Sans, sans-serif"><rect x="1" y="1" width="398" height="208" rx="8" fill="#f7f4ec" stroke="#bdb5a3"/><polygon points="10,120 390,120 380,200 20,200" fill="#d9cfae" stroke="#b8a77a" stroke-width="1.5" stroke-linejoin="round"/><line x1="200" y1="170" x2="200" y2="70" stroke="#6e4520" stroke-width="6" stroke-linecap="round"/><line x1="200" y1="170" x2="110" y2="140" stroke="#7d7563" stroke-width="6" stroke-linecap="round"/><line x1="200" y1="170" x2="290" y2="146" stroke="#7d7563" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="140" r="6" fill="#fff" stroke="#1e1e1e" stroke-width="2"/><circle cx="290" cy="146" r="6" fill="#fff" stroke="#1e1e1e" stroke-width="2"/><line x1="110" y1="140" x2="290" y2="146" stroke="#d0342c" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><polygon points="300,146.4 289,151.2 289.4,140.8" fill="#d0342c" stroke="#d0342c" stroke-width="1" stroke-linejoin="round"/><text x="96" y="124" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">1st mark</text><text x="96" y="168" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">West</text><text x="304" y="130" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">2nd mark</text><text x="318" y="168" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">East</text><text x="200" y="30" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Mark the shadow tip, wait 15-20 minutes, mark again.</text><text x="200" y="46" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">1st mark = West, 2nd = East. North is at a right angle</text><text x="200" y="62" font-size="12" text-anchor="middle" fill="#1e1e1e" font-weight="normal" stroke="#f7f4ec" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(left of the line when you face East).</text></svg>
